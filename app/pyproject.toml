[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linuxready"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
    "PySide6>=6.7",
    "PyQtDarkTheme>=2.1",
    "Jinja2>=3.1",
    "rapidfuzz>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
linuxready = "linuxready.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linuxready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
